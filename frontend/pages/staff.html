<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../media/logo.png">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/panel.css">
    <title>Coffee Shop — Staff panel</title>
</head>
<body>

    <div id="site-header-root"></div>

    <!-- Shown only if a non-staff account somehow lands here -->
    <p class="panel-guard-message" id="panel-guard-message" hidden>
        This page is available to coffee shop staff only.
    </p>

    <main class="panel-main" id="panel-content" hidden>
        <div class="panel-header panel-header-row">
            <div>
                <p class="panel-eyebrow">Staff panel</p>
                <h1 class="panel-title">Order queue</h1>
            </div>

            <div class="queue-filter-tabs" id="queue-filter-tabs" role="tablist" aria-label="Filter by status">
                <button type="button" class="queue-filter-btn active" data-status="all">All</button>
                <button type="button" class="queue-filter-btn" data-status="paid">Paid</button>
                <button type="button" class="queue-filter-btn" data-status="in_progress">In progress</button>
                <button type="button" class="queue-filter-btn" data-status="ready">Ready for pickup</button>
            </div>
        </div>

        <section class="panel-section">
            <ul class="queue-list" id="order-queue"></ul>
        </section>
    </main>

    <div id="site-footer-root"></div>

    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/cart_store.js"></script>
    <script src="../js/order_queue.js"></script>
    <script src="../js/staff.js"></script>
</body>
</html>
