<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop — Меню</title>
  <link rel="icon" type="image/png" href="../media/logo.png" class="site-logo">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/catalog.css">
  <link rel="stylesheet" href="../css/toast.css">
</head>
<body>

  <div id="site-header-root"></div>

  <div class="page-container">

    <header class="catalog-header">
      <div class="header-text">
        <p class="header-eyebrow">Меню кофейни</p>
        <h1>Наше меню</h1>
        <p class="header-subtitle">Свежая выпечка, десерты и кофе — каждый день</p>
      </div>

      <div class="bean-divider" aria-hidden="true"></div>

      <!-- Search + category filters. Chips are built from the loaded
           products' real categories in catalog.js — "Всё" below is
           just the loading-state placeholder. -->
      <div class="catalog-controls">
        <label class="search-box" for="search-input">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="text" id="search-input" placeholder="Найти в меню..." autocomplete="off">
        </label>

        <div class="filter-chips" id="filter-chips">
          <button class="chip active" data-category="all" type="button">Всё</button>
        </div>

        <!-- Sorting is resolved on the backend (GET /products/?sort_by=&order=) —
             see catalog.js, this control just picks the query params. -->
        <label class="sort-select" for="sort-select">
          <span class="sort-select-label">Сортировка</span>
          <select id="sort-select">
            <option value="name:asc">По названию А→Я</option>
            <option value="name:desc">По названию Я→А</option>
            <option value="price:asc">Сначала дешевле</option>
            <option value="price:desc">Сначала дороже</option>
            <option value="rating:desc">По рейтингу</option>
            <option value="popularity:desc">По популярности</option>
          </select>
        </label>
      </div>

      <p class="results-count" id="results-count"></p>
    </header>

    <!-- Filled in by catalog.js — loaded from the API on page load -->
    <main>
      <div id="products-container" class="products-grid">
        <p id="loading-text">Загрузка меню...</p>
      </div>
    </main>

  </div>

  <div id="site-footer-root"></div>

  <!-- api.js must load before catalog.js — catalog.js relies on API_BASE_URL -->
  <script src="../js/api.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/cart_store.js"></script>
  <script src="../js/catalog.js" defer></script>
</body>
</html>
