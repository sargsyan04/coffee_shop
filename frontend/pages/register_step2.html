<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../media/logo.png">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/toast.css">
    <title>Coffee Shop — Email verification</title>
</head>
<body>

    <div class="central_block auth_block">
        <div class="central_header">
            <span class="eyebrow" id="step-eyebrow">Step 2 of 2</span>
            <img src="../media/big_logo.png" alt="Coffee Shop">
            <h1>Verify your email</h1>
        </div>

        <!-- Progress dots — only relevant right after registration; hidden
             when this page is reached from the login "not confirmed" case,
             see register_step2.js -->
        <div class="step_indicator" id="step-indicator">
            <span class="step_dot"></span>
            <span class="step_dot active"></span>
        </div>

        <!-- Filled in by register_step2.js from sessionStorage -->
        <p class="confirm_text">We sent a 6-digit code to <strong id="user-email">your email</strong></p>

        <form class="auth_form" id="verify-form" novalidate>
            <div class="form_group full_row">
                <label for="code">Verification code</label>
                <input type="text" id="code" name="code" maxlength="6" placeholder="000000" inputmode="numeric" required>
            </div>

            <button type="submit" class="button_s sign_in full_width full_row">Verify</button>
            <!-- /user/resend-code issues a fresh code for an unverified account -->
            <button type="button" class="skip_link" id="resend-code">Resend code</button>

            <p class="form_status full_row" id="form-status" hidden></p>
        </form>
    </div>

    <!-- api.js must load before register_step2.js -->
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/register_step2.js"></script>
</body>
</html>
