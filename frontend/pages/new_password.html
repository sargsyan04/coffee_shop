<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../media/logo.png">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/toast.css">
    <title>Coffee Shop — Recovery</title>
</head>
<body>

    <div class="central_block auth_block">
        <div class="central_header">
            <span class="eyebrow" id="step-eyebrow">Account recovery</span>
            <img src="../media/big_logo.png" alt="Coffee Shop">
            <h1>Set a new password</h1>
        </div>

        <!-- Filled in by new_password.js from sessionStorage -->
        <p class="confirm_text">We sent a 6-digit code to <strong id="user-email">your email</strong></p>

        <form class="auth_form" id="new-password-form" novalidate>
            <div class="form_group full_row">
                <label for="code">Verification code</label>
                <input type="text" id="code" name="code" maxlength="6" placeholder="000000" inputmode="numeric" required>
            </div>

            <div class="form_group">
                <label for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" placeholder="••••••••" required>
            </div>

            <div class="form_group">
                <label for="new_password_confirm">Repeat password</label>
                <input type="password" id="new_password_confirm" name="new_password_confirm" placeholder="••••••••" required>
            </div>

            <button type="submit" class="button_s sign_in full_width full_row" id="submit-button">Restore account</button>
            <!-- Re-sends the code — which endpoint depends on recovery_context,
                 see new_password.js -->
            <button type="button" class="skip_link" id="resend-code">Resend code</button>

            <p class="form_status full_row" id="form-status" hidden></p>
        </form>
    </div>

    <!-- api.js must load before new_password.js -->
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/new_password.js"></script>
</body>
</html>
