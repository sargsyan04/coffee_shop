<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="../media/logo.png">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/toast.css">
    <title>Coffee Shop — Восстановление пароля</title>
</head>
<body>

    <div class="central_block auth_block">
        <div class="central_header">
            <span class="eyebrow">Восстановление пароля</span>
            <img src="../media/big_logo.png" alt="Coffee Shop">
            <h1>Забыли пароль?</h1>
        </div>

    <a href="login.html" class="back_link">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Назад
    </a>

        <p class="confirm_text">Укажите email — мы вышлем код для сброса пароля</p>

        <!-- Sends the code via POST /user/forgot-password, see forgot_password.js -->
        <form class="auth_form" id="forgot-password-form" novalidate>
            <div class="form_group full_row">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <button type="submit" class="button_s sign_in full_width full_row">Отправить код</button>

            <p class="form_status full_row" id="form-status" hidden></p>
        </form>
    </div>

    <!-- api.js must load before forgot_password.js -->
    <script src="../js/api.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/forgot_password.js"></script>
</body>
</html>
