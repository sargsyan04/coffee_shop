<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop — Товар</title>
  <link rel="icon" type="image/png" href="../media/logo.png">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/product.css">
  <link rel="stylesheet" href="../css/toast.css">
</head>
<body>

  <div id="site-header-root"></div>

  <div class="page-container">

    <nav class="breadcrumb" id="breadcrumb" aria-label="Хлебные крошки">
      <a href="catalog.html" class="breadcrumb-link">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Меню
      </a>
    </nav>

    <!-- Filled in by product.js — reads the product id from the URL query string -->
    <div id="product-detail" class="product-detail">
      <p id="loading-text">Загрузка товара...</p>
    </div>

  </div>

  <div id="site-footer-root"></div>

  <!-- api.js must load before product.js — product.js relies on API_BASE_URL -->
  <script src="../js/api.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/cart_store.js"></script>
  <script src="../js/product.js" defer></script>
</body>
</html>
