[project]
name = "coffee-shop"
version = "1.0.0"
description = "Coffee Shop management system: FastAPI backend with a vanilla JS frontend"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools]
# The project is an application, not a library: nothing is built or published
py-modules = []

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies = { dev = { file = ["requirements-dev.txt"] } }

[tool.ruff]
line-length = 150
target-version = "py314"

exclude = [
    ".venv",
    "alembic",
    "migrations",
    ".git",
    ".tox",
    "dist",
    "doc",
    "*openstack/common/*",
    "*lib/python*",
    "*egg",
    "build",
    "tools/xenserver*",
    "releasenotes",
]

[tool.ruff.lint]
ignore = [
    "E712",
    "B008",
    # Python 3.14 lets ruff suggest unquoting annotations, but SQLAlchemy models
    # use quoted forward references like Mapped["User"] for circular relationships
    "UP037",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
