[tool.ruff]
line-length = 150

exclude = [
    ".venv",
    "alembic",
    "migrations",
    ".git",
    ".tox",
    "dist",
    "doc",
    "*openstack/common/*",
    "*lib/python*",
    "*egg",
    "build",
    "tools/xenserver*",
    "releasenotes",
]

[tool.ruff.lint]
ignore = ["E712", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
